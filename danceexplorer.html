body {

/* ── PAGE SHELL: 3 columns from the very top ─────── */
.page-shell {
    display: flex;
    min-height: 100vh;
}

/* ── LOGO SIDEBARS ──────────────────────────────────── */
.logo-sidebar {
    display: none;
    flex-direction: column;
    gap: 14px;
    padding: 16px 0 24px;
    background: #1c0c32;
    width: 210px;
    flex-shrink: 0;
}

@media (min-width: 900px) {
    .logo-sidebar { display: flex; }
}

/* Left logos: flush to the left edge */
.left-bar {
    align-items: flex-start;
}

/* Right logos: flush to the right edge */
.right-bar {
    align-items: flex-end;
}

.logo-sidebar img {
    display: block;
    height: auto;
    max-height: 110px;
    object-fit: contain;
    opacity: 1;
    transition: opacity 0.45s ease;
}

/* ── MAIN COLUMN ────────────────────────────────────── */
.main-col {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
    background: #f7f7f7;
}

/* ── SVG HEADER: dancers + line, DANCE text removed ── */
.site-header {
    background: #1c0c32;
    text-align: center;
    padding: 0;
    overflow: hidden;
    line-height: 0;
}

.site-header svg {
    display: block;
    width: 100%;
    max-width: 700px;
    height: auto;
    margin: 0 auto;
}

/* ── FIND BUTTONS: sit in the space between line and DANCE ── */
.find-row {
    background: #1c0c32;
    border-bottom: 3px solid #d4af37;
    display: flex;
    gap: 16px;
    padding: 16px 24px;
}

.find-btn {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    text-decoration: none;
    padding: 14px 16px;
    border: 1.5px solid rgba(212,175,55,0.5);
    border-radius: 6px;
    background: rgba(212,175,55,0.07);
    transition: background 0.15s, border-color 0.15s;
}

.find-btn:hover {
    background: rgba(212,175,55,0.18);
    border-color: rgba(212,175,55,0.85);
}

.btn-title {
    font-family: 'Cinzel Decorative', Georgia, serif;
    font-size: clamp(13px, 1.8vw, 20px);
    font-weight: 700;
    color: #d4af37;
    line-height: 1.3;
    letter-spacing: 0.07em;
    margin-bottom: 10px;
}

.btn-desc {
    font-size: 12px;
    color: rgba(255,255,255,0.72);
    line-height: 1.55;
    margin: 0;
    max-width: 300px;
}

/* ── DANCE / EXPLORER TITLE BAND ────────────────────── */
.dance-band {
    background: #1c0c32;
    text-align: center;
    padding: 4px 0 16px;
    line-height: 1;
}

.dance-text {
    display: block;
    font-family: 'Cinzel Decorative', Georgia, serif;
    font-size: clamp(40px, 7.5vw, 92px);
    font-weight: 700;
    color: #d4af37;
    letter-spacing: 0.05em;
}

.explorer-text {

    font-family: 'Cinzel Decorative', Georgia, serif;
    font-size: clamp(14px, 1.92vw, 36px);
    font-weight: 700;
    color: #d4af37;
    letter-spacing: 0.5em;

    margin-top: 2px;
}
/* ── BOTTOM LOGO BAR ────────────────────────────────── */

}

    opacity: 1;

<script>
(function () {
  const TOKEN = 'pk_SR42vr_kR7uOjccTv8yvdg';

  // ── Single logo pool — add more domains here as needed ──────────────────
  const allLogos = [
    { domain: 'nycballet.com',           alt: 'New York City Ballet' },
    { domain: 'abt.org',                 alt: 'American Ballet Theatre', xtra: true },
    { domain: 'alvinailey.org',          alt: 'Alvin Ailey' },
    { domain: 'sfballet.org',            alt: 'San Francisco Ballet' },
    { domain: 'bostonballet.org',        alt: 'Boston Ballet' },
    { domain: 'houstonballet.org',       alt: 'Houston Ballet' },
    { domain: 'joffrey.org',             alt: 'Joffrey Ballet' },
    { domain: 'pnb.org',                 alt: 'Pacific Northwest Ballet' },
    { domain: 'coloradoballet.org',      alt: 'Colorado Ballet' },
    { domain: 'philadelphiaballet.org',  alt: 'Philadelphia Ballet' },
    { domain: 'pbt.org',                 alt: 'Pittsburgh Ballet' },
    { domain: 'atlantaballet.com',       alt: 'Atlanta Ballet' },
    { domain: 'balletwest.org',          alt: 'Ballet West' },
    { domain: 'carolinaballet.com',      alt: 'Carolina Ballet' },
    { domain: 'charlotteballet.org',     alt: 'Charlotte Ballet' },
    { domain: 'cballet.org',             alt: 'Cincinnati Ballet' },
    { domain: 'kcballet.org',            alt: 'Kansas City Ballet' },
    { domain: 'balletmemphis.org',       alt: 'Ballet Memphis' },
    { domain: 'obt.org',                 alt: 'Oregon Ballet Theatre' },
    { domain: 'sarasotaballet.org',      alt: 'Sarasota Ballet' },
    { domain: 'texasballettheater.org',  alt: 'Texas Ballet Theater' },
    { domain: 'austinballet.org',        alt: 'Austin Ballet' },
  ]; // 22 logos

  // Slot widths (px): 6 per sidebar, 4 for bottom row
  const leftWidths   = [195, 155, 185, 163, 178, 148];
  const rightWidths  = [188, 152, 172, 158, 192, 163];
  const bottomWidths = [165, 150, 170, 155];

  const FADE     = 450;   // ms fade duration
  const INTERVAL = 1000;  // ms between each single swap

  function imgUrl(domain) {
    return `https://img.logo.dev/${domain}?token=${TOKEN}&format=png`;
  }

  function applyLogo(img, logo, width) {
    img.src   = imgUrl(logo.domain);
    img.alt   = logo.alt;
    if (width) img.style.width = width + 'px';
    img.style.filter       = logo.xtra ? 'invert(1)' : '';
    img.style.mixBlendMode = logo.xtra ? 'screen'    : '';
  }

  function makeImg(logo, width) {
    const img = document.createElement('img');
    img.style.cssText = `display:block; height:auto; object-fit:contain;
                         max-height:110px; opacity:1;
                         transition:opacity ${FADE}ms ease;`;
    applyLogo(img, logo, width);
    return img;
  }

  function buildSlots(el, logos, widths) {
    el.innerHTML = '';
    return logos.map((logo, i) => {
      const img = makeImg(logo, widths[i]);
      el.appendChild(img);
      return img;
    });
  }

  function swap(img, logo, width) {
    img.style.opacity = '0';
    setTimeout(() => { applyLogo(img, logo, width); img.style.opacity = '1'; }, FADE);
  }

  document.addEventListener('DOMContentLoaded', () => {
    const leftEl   = document.querySelector('.left-bar');
    const rightEl  = document.querySelector('.right-bar');
    const bottomEl = document.getElementById('bottom-bar');
    if (!leftEl || !rightEl || !bottomEl) return;

    // Fill all 16 slots: Left [0-5], Bottom [6-9], Right [10-15]
    const leftImgs   = buildSlots(leftEl,   allLogos.slice(0,  6),  leftWidths);
    const bottomImgs = buildSlots(bottomEl, allLogos.slice(6,  10), bottomWidths);
    const rightImgs  = buildSlots(rightEl,  allLogos.slice(10, 16), rightWidths);

    // Conveyor-belt: down the left (slot 0→5), across bottom (0→3), up the right (slot 5→0)
    const sequence = [
      ...leftWidths.map(  (w, i) => ({ imgs: leftImgs,   slot: i,     width: w })),
      ...bottomWidths.map((w, i) => ({ imgs: bottomImgs, slot: i,     width: w })),
      ...rightWidths.map( (w, i) => ({ imgs: rightImgs,  slot: 5 - i, width: rightWidths[5 - i] })),
    ]; // 16 steps total

    let seqStep  = 0;
    let nextLogo = 16 % allLogos.length; // first logo not yet on screen

    setInterval(() => {
      const step = sequence[seqStep];
      swap(step.imgs[step.slot], allLogos[nextLogo], step.width);
      seqStep  = (seqStep  + 1) % sequence.length;
      nextLogo = (nextLogo + 1) % allLogos.length;
    }, INTERVAL);
  });
})();
</script>
